# =====================================================================
# Settings for the whole workflow.
# All paths, years, thresholds and indicator definitions live here.
# To run the analysis for another state or ACS release, change [study].
# =====================================================================

[study]
state_fips = "08"          # Colorado
state_abbr = "CO"
acs_year = 2024            # last year of the 5-year ACS period (2020-2024)
tiger_year = 2024          # TIGER/Line boundary year
scales = ["block group", "tract", "county"]   # from smallest to largest
crs = "EPSG:5070"          # NAD83 / Conus Albers, an equal-area projection

[paths]                    # all paths are relative to the repository folder
raw = "data/raw"           # downloads, never edited
processed = "data/processed"
maps = "outputs/maps"
tables = "outputs/tables"
logs = "logs"

[maps]
zoom_name = "Denver metro"                    # second row of each map: a zoom on the densest area
zoom_bbox = [-105.35, 39.45, -104.60, 40.10]  # west, south, east, north (degrees)
zoom_indicator_maps = false                   # add the zoom row to the 24 indicator maps (slower)
diff_limit = 60                               # color range of difference maps: -60 to +60 rank points
hist_bin = 5                                  # bin width (rank points) of the difference histograms

[test]
sample_units = 2           # units per scale in the hand-check table
sample_indicators = ["QPOVTY", "QRENTER", "PERCAP", "QNOAUTO"]
seed = 11

[download]
max_tries = 3              # tries per web request before giving up
wait_seconds = 5           # wait between tries (doubles each time)
vars_per_request = 48      # the Census API accepts at most 50 fields per request

[screening]
max_missing_share = 0.20   # drop an indicator if more than 20% of units are missing at any scale
min_population = 1         # drop units with fewer people than this

[index]
retention = "kaiser"       # keep components with eigenvalue > 1 ("kaiser"), or a fixed number ("fixed")
n_components = 6           # used only when retention = "fixed"
loading_threshold = 0.5    # loadings at or above this size decide a component's direction
top_share = 0.20           # "most vulnerable" = top 20% of units

[uncertainty]
n_simulations = 500        # Monte Carlo draws of the ACS estimates
z_90 = 1.645               # ACS margins of error are at the 90% level
seed = 3050                # fixed random seed so results can be repeated
cv_high = 12               # CV below 12% = high reliability
cv_low = 40                # CV above 40% = low reliability

# ---------------------------------------------------------------------
# Indicators (25 SoVI 2019 variables available in ACS detailed tables).
#   type      "value" = a single ACS estimate (e.g., a median)
#             "prop"  = sum(num) / sum(den) * 100  (percent)
#             "ratio" = sum(num) / sum(den)        (e.g., persons per unit)
#   num, den  ACS variable codes without the E/M suffix.
#             A "-" in front of a code subtracts it (e.g., "not computed").
#   direction +1 if a higher value means more vulnerable, -1 if less.
# ---------------------------------------------------------------------

